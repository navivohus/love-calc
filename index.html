<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Love Calculator ♥️</title>
  <script src="https://telegram.org"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 16px 12px 20px;
      background-color: #FFF0F5;
      font-family: 'Marck Script', 'Segoe Script', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      overflow: hidden;
    }

    .title {
      width: 100%;
      max-width: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #C9184A;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin: 6px auto 14px;
      line-height: 1;
    }

    .title-heart {
      width: 24px;
      height: 24px;
      fill: #E01E5A;
      flex-shrink: 0;
      transform: translateY(1px);
    }

    .screen {
      width: 100%;
      max-width: 390px;
      height: 82px;
      background: #FFFFFF;
      border: 2.5px solid #FF8FA3;
      border-radius: 26px;
      box-shadow: 0 5px 0 #F4B8C8;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 22px;
      font-size: 36px;
      color: #800F2F;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 400px;
      padding-bottom: 10px;
    }

    .heart-btn {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease;
    }

    .heart-btn:active {
      transform: scale(0.92);
    }

    .heart-btn svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 0 #F4B8C8);
    }

    .heart-btn span {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Marck Script', 'Segoe Script', cursive;
      font-size: 17px;
      font-weight: bold;
      pointer-events: none;
      white-space: nowrap;
    }

    .num svg path { fill: #FFC2D1; stroke: #FF8FA3; }
    .num span { color: #590D22; }

    .op svg path { fill: #FF8FA3; stroke: #FF4D6D; }
    .op span { color: #FFFFFF; }

    .clr svg path { fill: #FFE5EC; stroke: #FFB3C6; }
    .clr span { color: #A4133C; }

    .eq svg path { fill: #E01E5A; stroke: #A4133C; }
    .eq span { color: #FFFFFF; }
  </style>
</head>
<body>

  <div class="title">
    <svg class="title-heart" viewBox="0 0 100 95">
      <path d="M50 86 C50 86 8 60 8 30 C8 14 21 6 34 6 C42 6 47 11 50 16 C53 11 58 6 66 6 C79 6 92 14 92 30 C92 60 50 86 50 86 Z"/>
    </svg>
    <span>For My Love</span>
    <svg class="title-heart" viewBox="0 0 100 95">
      <path d="M50 86 C50 86 8 60 8 30 C8 14 21 6 34 6 C42 6 47 11 50 16 C53 11 58 6 66 6 C79 6 92 14 92 30 C92 60 50 86 50 86 Z"/>
    </svg>
  </div>

  <div class="screen" id="display"></div>

  <div class="grid" id="buttons-grid"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#FFF0F5');
      tg.setBackgroundColor('#FFF0F5');
    }

    let expression = "";
    const displayEl = document.getElementById("display");

    const buttons = [
      { label: 'seven', val: '7', type: 'num' }, { label: 'eight',  val: '8', type: 'num' }, { label: 'nine',   val: '9', type: 'num' }, { label: 'divide', val: '/', type: 'op' },
{ label: 'four',  val: '4', type: 'num' }, { label: 'five',   val: '5', type: 'num' }, { label: 'six',    val: '6', type: 'num' }, { label: 'times',  val: '*', type: 'op' },
      { label: 'one',   val: '1', type: 'num' }, { label: 'two',    val: '2', type: 'num' }, { label: 'three',  val: '3', type: 'num' }, { label: 'minus',  val: '-', type: 'op' },
      { label: 'clear', val: 'C', type: 'clr' }, { label: 'zero',   val: '0', type: 'num' }, { label: 'equals', val: '=', type: 'eq'  }, { label: 'plus',   val: '+', type: 'op' }
    ];

    const heartSVG = 
      <svg viewBox="0 0 100 95">
        <path stroke-width="2.5" d="M50 86 C50 86 8 60 8 30 C8 14 21 6 34 6 C42 6 47 11 50 16 C53 11 58 6 66 6 C79 6 92 14 92 30 C92 60 50 86 50 86 Z"/>
      </svg>
    ;

    function updateDisplay(text) {
      displayEl.textContent = text.replace(/\*/g, '×').replace(/\//g, '÷');
    }

    function handlePress(val) {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      if (val === 'C') {
        expression = "";
        updateDisplay("");
      } else if (val === '=') {
        try {
          if (!expression) return;
          let res = Function('"use strict";return (' + expression + ')')();
          if (!isFinite(res)) throw new Error();
          res = Math.round(res * 1000000) / 1000000;
          expression = String(res);
          updateDisplay(expression);
        } catch {
          expression = "";
          updateDisplay("Error ♥️");
        }
      } else {
        expression += val;
        updateDisplay(expression);
      }
    }

    const grid = document.getElementById("buttons-grid");
    buttons.forEach(btn => {
      const el = document.createElement("button");
      el.className = heart-btn ${btn.type};
      el.innerHTML = ${heartSVG}<span>${btn.label}</span>;
      el.addEventListener("click", () => handlePress(btn.val));
      grid.appendChild(el);
    });
  </script>
</body>
</html>
